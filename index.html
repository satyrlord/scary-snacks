<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#eee7dc" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1614" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Scary Snacks: a cosy Transylvanian bistro. Merge local dishes, welcome your neighbours, and keep the black cats company.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Scary Snacks</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./src/style.css">
  <script type="module" src="./src/app.ts"></script>
</head>
<body>
  <a class="skip-link" href="#board">Skip to the board</a>
  <!-- One repeat of the runner bitmap (x 161, width 503) tiles without a seam; the whole bitmap does not. -->
  <svg class="runner-source" aria-hidden="true" focusable="false"><defs><pattern id="runner-repeat" patternUnits="userSpaceOnUse" width="503" height="512"><image href="./assets/variants/embroidered-runner-384x128.webp" x="-161" y="0" width="1536" height="512"/></pattern></defs></svg>
  <header class="masthead">
    <div class="brand">
      <h1 class="wordmark"><span class="mascot cat-sitting" aria-hidden="true"></span><span>Scary Snacks</span></h1>
      <p class="tagline">Good food. Curious company.</p>
    </div>
    <div class="header-controls">
      <p class="coin-count" id="coin-count"><span class="visually-hidden" id="coin-total">0 coins</span><svg class="coin" viewBox="0 0 24 24" aria-hidden="true"><circle class="coin-face" cx="12" cy="12" r="9"/><path class="coin-moon" d="M15.7 7.6a5 5 0 1 0 0 8.8 4.6 4.6 0 0 1 0-8.8z"/></svg><span id="coins" aria-hidden="true">0</span><span class="coin-label" id="coin-label" aria-hidden="true">coins</span></p>
      <button type="button" class="book-button" data-house-book aria-label="House book: settings and saved game"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h12a1 1 0 0 1 1 1v15a1 1 0 0 1-1 1H6a1.5 1.5 0 0 1-1.5-1.5v-14A1.5 1.5 0 0 1 6 3.5zM8 3.5v17"/><path d="m10.6 12.3 2.9-2.5 2.9 2.5M11.4 11.6v3.6h4.2v-3.6"/></svg><span>House book</span></button>
    </div>
  </header>
  <main class="game-layout">
    <!-- The room is the game's home and its reward: one painting of the area as the completed preparations leave it. The game draws it once the save is read, so only the current state downloads. -->
    <section class="room" id="room" aria-label="The bistro">
      <figure class="room-stage" id="room-stage">
        <div class="room-frame" id="room-frame">
          <div class="room-paintings" id="room-paintings"></div>
          <div class="room-decorations" id="room-decorations" aria-hidden="true"></div>
          <span class="window-sky" aria-hidden="true"></span>
          <span class="mascot cat-sleeping counter-cat" aria-hidden="true"></span>
          <button type="button" class="miez sill-cat" id="cat-button" aria-label="Give Miez, the bistro cat, some attention"><span class="mascot miez-sprite cat-sitting" aria-hidden="true"></span></button>
          <button type="button" class="room-pin" id="room-pin" hidden><span class="pin-dot" aria-hidden="true"></span>New</button>
        </div>
        <figcaption class="room-caption" id="room-caption"></figcaption>
      </figure>
      <div class="area-switch" id="area-switch" role="group" aria-label="Rooms of the bistro"></div>
    </section>
    <!-- The kitchen is a drawer pulled up over the room on phones, and a panel docked beside it on wider screens. -->
    <div class="drawer" id="drawer">
      <button type="button" class="drawer-handle" id="drawer-handle" aria-controls="drawer-body" aria-expanded="true" aria-label="Lower the kitchen to see the room"><span aria-hidden="true"></span></button>
      <section class="tickets" aria-label="Neighbour orders"><div class="orders" id="orders"></div></section>
      <div class="drawer-body" id="drawer-body">
        <section class="kitchen" aria-label="Kitchen">
          <div class="table">
            <svg class="runner" viewBox="0 0 40000 512" preserveAspectRatio="xMinYMid slice" aria-hidden="true" focusable="false"><rect width="40000" height="512" fill="url(#runner-repeat)"/></svg>
            <div id="board" class="board" role="group" aria-label="Merge board, 6 columns and 7 rows" tabindex="-1"></div>
            <svg class="runner" viewBox="0 0 40000 512" preserveAspectRatio="xMinYMid slice" aria-hidden="true" focusable="false"><rect width="40000" height="512" fill="url(#runner-repeat)"/></svg>
          </div>
          <div class="line-slot">
            <div class="guide"><span class="portrait portrait-0" role="img" aria-label="Mara, the bistro owner"></span><p id="status" role="status" aria-live="polite">Opening the kitchen…</p><button type="button" class="text-button" id="hint-button">Find a match</button></div>
            <div class="offer" id="offer"></div>
            <section class="item-detail" id="item-detail" aria-label="Selected item"></section>
          </div>
        </section>
        <div class="side" id="side">
          <aside class="story-panel" id="story" aria-label="The bistro and story"></aside>
          <button type="button" class="recipe-book" id="collection-button"><span class="mascot bat" aria-hidden="true"></span><span><strong>The recipe book</strong><small id="discovery-count">Your menu is taking shape.</small></span></button>
        </div>
      </div>
    </div>
  </main>
  <nav class="phone-bar" aria-label="Bistro"><button type="button" id="story-button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5v2.2M8.6 7.5h6.8l1.1 3.6h-9z"/><path d="M8.2 11.1 9 18.5h6l.8-7.4M10 20.5h4"/></svg><span>Story</span></button><button type="button" id="recipes-button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11h16M5.5 11l1 8.5h11l1-8.5"/><path d="M9.5 8c-.8-1 .8-2 0-3.2M14.5 8c-.8-1 .8-2 0-3.2"/></svg><span>Recipes</span></button><button type="button" data-house-book aria-label="House book: settings and saved game"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h12a1 1 0 0 1 1 1v15a1 1 0 0 1-1 1H6a1.5 1.5 0 0 1-1.5-1.5v-14A1.5 1.5 0 0 1 6 3.5zM8 3.5v17"/><path d="m10.6 12.3 2.9-2.5 2.9 2.5M11.4 11.6v3.6h4.2v-3.6"/></svg><span>House book</span></button></nav>
  <dialog id="modal" aria-labelledby="modal-title"><header class="modal-heading"><h2 id="modal-title" tabindex="-1"></h2><button id="close-modal" class="icon-button" aria-label="Close dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></header><div id="modal-body"></div></dialog>
  <noscript>Enable JavaScript in your browser, then reload this page to open the kitchen.</noscript>
</body>
</html>
